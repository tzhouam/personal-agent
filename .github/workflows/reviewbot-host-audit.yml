name: Audit Personal-Agent dashboard hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure the existing restricted Personal-Agent deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/personal-agent-deploy
          chmod 600 ~/.ssh/personal-agent-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Capture read-only host audit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh -T \
            -i ~/.ssh/personal-agent-deploy \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" reviewbot-host-audit \
            > "$RUNNER_TEMP/reviewbot-host-audit.txt"
      - name: Upload private audit artifact
        uses: actions/upload-artifact@v6
        with:
          name: reviewbot-host-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewbot-host-audit.txt
          if-no-files-found: error
          retention-days: 1

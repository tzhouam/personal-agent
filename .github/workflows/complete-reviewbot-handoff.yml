name: Complete one-time ReviewBot host-key handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare digest-bound ReviewBot host admin
        env:
          ADMIN_SCRIPT: ${{ secrets.REVIEWBOT_HANDOFF_ADMIN_SCRIPT }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/handoff"
          printf '%s\n' "$ADMIN_SCRIPT" \
            > "$RUNNER_TEMP/handoff/omni-reviewbot-host-admin"
          bash -n "$RUNNER_TEMP/handoff/omni-reviewbot-host-admin"
          chmod 700 "$RUNNER_TEMP/handoff/omni-reviewbot-host-admin"
          tar -C "$RUNNER_TEMP/handoff" -czf "$RUNNER_TEMP/host-admin.tar.gz" \
            omni-reviewbot-host-admin
      - name: Upgrade the restricted seed and verify it
        env:
          HANDOFF_KEY: ${{ secrets.REVIEWBOT_HANDOFF_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HANDOFF_KEY" > ~/.ssh/reviewbot-handoff
          chmod 600 ~/.ssh/reviewbot-handoff
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/reviewbot-known-hosts
          chmod 600 ~/.ssh/reviewbot-known-hosts
          archive="$RUNNER_TEMP/host-admin.tar.gz"
          digest=$(sha256sum "$archive" | awk '{print $1}')
          ssh -T \
            -i ~/.ssh/reviewbot-handoff \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/reviewbot-known-hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" "seed $digest" < "$archive"
          ssh -T \
            -i ~/.ssh/reviewbot-handoff \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/reviewbot-known-hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" status

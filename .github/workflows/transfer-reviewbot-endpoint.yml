name: Transfer ReviewBot host endpoint ownership

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Store the existing host endpoint only in the ReviewBot repository
        env:
          GH_TOKEN: ${{ secrets.REVIEWBOT_ENDPOINT_HANDOFF_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          printf '%s' "$DEPLOY_HOST" |
            gh secret set REVIEWBOT_HOST_SSH_HOST --repo JiusiServe/omni-reviewbot
          printf '%s' "$DEPLOY_PORT" |
            gh secret set REVIEWBOT_HOST_SSH_PORT --repo JiusiServe/omni-reviewbot
          printf '%s' "$DEPLOY_USER" |
            gh secret set REVIEWBOT_HOST_SSH_USER --repo JiusiServe/omni-reviewbot
          printf '%s' "$DEPLOY_KNOWN_HOSTS" |
            gh secret set REVIEWBOT_HOST_SSH_KNOWN_HOSTS --repo JiusiServe/omni-reviewbot
          gh secret list --repo JiusiServe/omni-reviewbot |
            grep -E '^REVIEWBOT_HOST_SSH_(HOST|PORT|USER|KNOWN_HOSTS)[[:space:]]'

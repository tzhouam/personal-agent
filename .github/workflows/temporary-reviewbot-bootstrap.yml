name: One-time independent ReviewBot bootstrap

on:
  workflow_dispatch:
    inputs:
      migration_run_id:
        description: Successful encrypted migration export run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: one-time-reviewbot-production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the immutable canonical ReviewBot release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JiusiServe/omni-reviewbot
          ref: fb894f095795b9a8df5c6c5a0ed340e2b4ab6f80
          token: ${{ secrets.MIGRATION_GH_TOKEN }}
          persist-credentials: false
      - name: Download and verify the cutover payload
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_GH_TOKEN }}
          MIGRATION_ARCHIVE_KEY: ${{ secrets.MIGRATION_ARCHIVE_KEY }}
          MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
          BOOTSTRAP_SHA: fb894f095795b9a8df5c6c5a0ed340e2b4ab6f80
          REVIEWBOT_SHA: de3045f1b9a8047bd20685ab05bb8ff6cb3e7aa2
          REVIEWBOT_RUN_ID: "33372546646"
          CADDY_VERSION: "2.11.4"
          CADDY_SHA256: "c41708ffb4af9bc6d19f7d22a7a034804352a21ecc62e1d3dfe3d58e30b38a3e"
        run: |
          [[ "$MIGRATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$BOOTSTRAP_SHA" ]]
          install -m 700 -d "$RUNNER_TEMP/cutover" "$RUNNER_TEMP/package"

          [[ "$(gh run view "$MIGRATION_RUN_ID" \
            --repo zuiho-kai/omni-reviewbot --json conclusion --jq .conclusion)" == success ]]
          gh run download "$MIGRATION_RUN_ID" \
            --repo zuiho-kai/omni-reviewbot \
            --name "reviewbot-migration-$MIGRATION_RUN_ID" \
            --dir "$RUNNER_TEMP/cutover/migration"
          mapfile -t encrypted < <(find "$RUNNER_TEMP/cutover/migration" \
            -type f -name 'reviewbot-migration-*.tar.gz.enc')
          [[ ${#encrypted[@]} -eq 1 ]]
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:MIGRATION_ARCHIVE_KEY \
            -in "${encrypted[0]}" \
            -out "$RUNNER_TEMP/package/migration.tar.gz"

          release_data=$(gh run view "$REVIEWBOT_RUN_ID" \
            --repo JiusiServe/omni-reviewbot --json conclusion,headSha)
          [[ "$(jq -r .conclusion <<<"$release_data")" == success ]]
          [[ "$(jq -r .headSha <<<"$release_data")" == "$REVIEWBOT_SHA" ]]
          gh run download "$REVIEWBOT_RUN_ID" \
            --repo JiusiServe/omni-reviewbot \
            --name "paired-release-$REVIEWBOT_SHA" \
            --dir "$RUNNER_TEMP/cutover/release"
          mapfile -t releases < <(find "$RUNNER_TEMP/cutover/release" \
            -type f -name "omni-reviewbot-$REVIEWBOT_SHA.tar.gz")
          [[ ${#releases[@]} -eq 1 ]]
          cp "${releases[0]}" "$RUNNER_TEMP/package/release.tar.gz"

          caddy_json=$(gh api "repos/caddyserver/caddy/releases/tags/v$CADDY_VERSION")
          caddy_asset_id=$(jq -r --arg name "caddy_${CADDY_VERSION}_linux_amd64.deb" \
            '.assets[] | select(.name == $name) | .id' <<<"$caddy_json")
          caddy_digest=$(jq -r --arg name "caddy_${CADDY_VERSION}_linux_amd64.deb" \
            '.assets[] | select(.name == $name) | .digest' <<<"$caddy_json")
          [[ "$caddy_asset_id" =~ ^[0-9]+$ ]]
          [[ "$caddy_digest" == "sha256:$CADDY_SHA256" ]]
          gh api -H 'Accept: application/octet-stream' \
            "repos/caddyserver/caddy/releases/assets/$caddy_asset_id" \
            > "$RUNNER_TEMP/package/caddy.deb"
          printf '%s\n' "$CADDY_SHA256" > "$RUNNER_TEMP/package/caddy.sha256"
          printf '%s  %s\n' "$CADDY_SHA256" "$RUNNER_TEMP/package/caddy.deb" |
            sha256sum -c -

          runner_json=$(gh api repos/actions/runner/releases/latest)
          runner_asset_id=$(jq -r \
            '.assets[] | select(.name | test("^actions-runner-linux-x64-[0-9.]+\\.tar\\.gz$")) | .id' \
            <<<"$runner_json")
          runner_digest=$(jq -r \
            '.assets[] | select(.id == '"$runner_asset_id"') | .digest' \
            <<<"$runner_json")
          [[ "$runner_asset_id" =~ ^[0-9]+$ ]]
          [[ "$runner_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api -H 'Accept: application/octet-stream' \
            "repos/actions/runner/releases/assets/$runner_asset_id" \
            > "$RUNNER_TEMP/package/actions-runner.tar.gz"
          printf '%s\n' "${runner_digest#sha256:}" \
            > "$RUNNER_TEMP/package/actions-runner.sha256"
          printf '%s  %s\n' "${runner_digest#sha256:}" \
            "$RUNNER_TEMP/package/actions-runner.tar.gz" | sha256sum -c -

          gh api --method POST \
            repos/JiusiServe/omni-reviewbot/actions/runners/registration-token \
            --jq .token > "$RUNNER_TEMP/package/runner-token"
          chmod 600 "$RUNNER_TEMP/package/runner-token"
          install -m 700 deploy/personal-agent/host-bootstrap.sh \
            "$RUNNER_TEMP/package/host-bootstrap.sh"
          tar -C "$RUNNER_TEMP/package" -czf "$RUNNER_TEMP/bootstrap-payload.tar.gz" \
            host-bootstrap.sh migration.tar.gz release.tar.gz caddy.deb caddy.sha256 \
            actions-runner.tar.gz actions-runner.sha256 runner-token
      - name: Stream through the dedicated restricted ReviewBot key
        env:
          REVIEWBOT_HOST_KEY: ${{ secrets.REVIEWBOT_HOST_SSH_PRIVATE_KEY }}
          REVIEWBOT_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REVIEWBOT_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REVIEWBOT_USER: ${{ secrets.DEPLOY_SSH_USER }}
          REVIEWBOT_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          REVIEWBOT_SHA: de3045f1b9a8047bd20685ab05bb8ff6cb3e7aa2
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$REVIEWBOT_HOST_KEY" > ~/.ssh/reviewbot-host
          chmod 600 ~/.ssh/reviewbot-host
          printf '%s\n' "$REVIEWBOT_KNOWN_HOSTS" > ~/.ssh/reviewbot-known-hosts
          chmod 600 ~/.ssh/reviewbot-known-hosts
          payload="$RUNNER_TEMP/bootstrap-payload.tar.gz"
          payload_sha=$(sha256sum "$payload" | awk '{print $1}')
          ssh -T \
            -i ~/.ssh/reviewbot-host \
            -p "$REVIEWBOT_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/reviewbot-known-hosts \
            "$REVIEWBOT_USER@$REVIEWBOT_HOST" \
            "bootstrap $REVIEWBOT_SHA $payload_sha" < "$payload"
      - name: Verify the new public read-only dashboards
        env:
          REVIEWBOT_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          base=https://review.43.155.186.30.nip.io
          for path in code_review/vllm_omni code_review/vllm_gr; do
            name=${path##*/}
            status_file="$RUNNER_TEMP/$name-status.json"
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 20 "$base/$path/api/status" > "$status_file"; then
                break
              fi
              [[ $attempt -lt 30 ]]
              sleep 10
            done
            python3 - "$status_file" <<'PY'
          import json
          import sys

          status = json.load(open(sys.argv[1], encoding="utf-8"))
          if status.get("maintenance") is not False:
              raise SystemExit("dashboard remained in maintenance")
          if status.get("poll_interval_seconds") != 120:
              raise SystemExit("unexpected dashboard poll interval")
          PY
            headers=$(curl -fsS -D - -o /dev/null --max-time 20 \
              "$base/$path/api/status")
            grep -iq '^cache-control: no-store' <<<"$headers"
          done
          location=$(curl -fsS -D - -o /dev/null --max-time 20 "$base/" | \
            awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub("\r", ""); print $2}')
          [[ "$location" == /code_review/vllm_omni/ ]]
          for port in 8765 8766; do
            if timeout 5 bash -c "</dev/tcp/$REVIEWBOT_HOST/$port" 2>/dev/null; then
              echo "ReviewBot loopback port $port is publicly reachable" >&2
              exit 1
            fi
          done
      - name: Deactivate the new host and request old-host rollback on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_GH_TOKEN }}
          REVIEWBOT_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REVIEWBOT_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REVIEWBOT_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          if [[ -f ~/.ssh/reviewbot-host ]]; then
            ssh -T \
              -i ~/.ssh/reviewbot-host \
              -p "$REVIEWBOT_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/reviewbot-known-hosts \
              "$REVIEWBOT_USER@$REVIEWBOT_HOST" deactivate || true
          fi
          gh workflow run migration-control.yml \
            --repo zuiho-kai/omni-reviewbot \
            --ref main \
            -f operation=rollback \
            -f migration_id=''

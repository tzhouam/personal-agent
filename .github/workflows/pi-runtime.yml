name: Validate Pi runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/assistant/platform/runtime/pi_host/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install -e . pytest
      - name: Install pinned Pi SDK without lifecycle scripts
        working-directory: src/assistant/platform/runtime/pi_host
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate actual Pi SDK host
        working-directory: src/assistant/platform/runtime/pi_host
        run: |
          npm run check
          node --test test/session.test.mjs
      - name: Confirm LangGraph is absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('langgraph') is None"
      - name: Run Python tests with local Pi providers
        run: python -m pytest -q

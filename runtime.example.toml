# Copy to ~/.personal-agent/runtime.toml, or pass --config /absolute/path/runtime.toml.
# Credentials remain in environment variables/.env; do not paste them into this file.
[runtime]
backend = "codex"
max_steps = 12
workers = 2
timeout = 300

[backends.codex]
kind = "codex"
command = ["codex"]
# Codex keeps its login but ignores inherited plugins/MCP/user settings.
# Set an explicit model or non-secret global -c arguments in command if required.
# model = "your-model"

[backends.deepseek]
kind = "openai"
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"

[backends.anthropic]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"
model = "claude-sonnet-4-6"

[backends.openai]
kind = "openai"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
# Select a model available to your account before choosing this route.
model = ""

# Compatible endpoints are named routes, for example:
# [backends.my_endpoint]
# kind = "openai"
# api_key_env = "MY_ENDPOINT_API_KEY"
# base_url = "https://your-endpoint.example/v1"
# model = "your-model"

[backends.claude]
kind = "claude"
# Native project writes need explicit external-isolation/unrestricted opt-in.
allow_unrestricted = false

[backends.gemini]
kind = "gemini"
# Gemini's configured native tools cannot all be disabled reliably. This flag
# is required even for controller turns; enable only in a trusted isolated setup.
allow_unrestricted = false

[backends.pi]
kind = "pi"
# Pi has no operating-system sandbox. Native writes need explicit opt-in.
allow_unrestricted = false

[channels.slack]
enabled = false
account_id = "work"
owner_id = "default"
app_token_env = "SLACK_APP_TOKEN"
bot_token_env = "SLACK_BOT_TOKEN"
team_id = "T_REPLACE_ME"
allowed_users = ["U_REPLACE_ME"]
allowed_channels = ["C_REPLACE_ME"]

[channels.qq]
enabled = false
account_id = "personal"
owner_id = "default"
ws_url = "ws://127.0.0.1:3001"
access_token_env = "QQ_ACCESS_TOKEN"
allowed_users = ["REPLACE_WITH_YOUR_QQ_ID"]
# Empty groups permits the allowed users in any group; set group IDs to restrict.
allowed_groups = []

# Project registration is an operator action. Never put the assistant's data dir
# here. Explicit verification commands execute project code on the TRUSTED HOST.
# [projects.example]
# path = "/absolute/path/to/project"
# verification = [["python", "-m", "pytest", "-q"]]
